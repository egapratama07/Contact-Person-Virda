<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Virda Ananda Putri</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;

    font-family:'Poppins',sans-serif;

    background:
    radial-gradient(circle at top left,
    rgba(255,241,234,.95),
    transparent 34%),

    radial-gradient(circle at bottom right,
    rgba(219,191,255,.65),
    transparent 34%),

    linear-gradient(
    135deg,
    #ffe8e2,
    #f8dce8,
    #f0ddff,
    #ffe1e8
    );

    background-size:400% 400%;
    animation:bgMove 16s ease infinite;
}

/* BACKGROUND ANIMATION */

@keyframes bgMove{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

/* SPARKLES */

body::before{
    content:"";
    position:absolute;
    inset:0;

    background-image:
    radial-gradient(rgba(255,255,255,.85) 1px, transparent 1px);

    background-size:110px 110px;

    opacity:.32;
    pointer-events:none;
}

/* GLOW */

.glow1,
.glow2{
    position:absolute;
    border-radius:50%;
    filter:blur(85px);
    z-index:0;
}

.glow1{
    width:230px;
    height:230px;
    background:#ffc8d7;
    top:-70px;
    left:-70px;
    opacity:.45;
}

.glow2{
    width:260px;
    height:260px;
    background:#d7bcff;
    bottom:-90px;
    right:-90px;
    opacity:.35;
}

/* FLOWER */

.flower-left,
.flower-right{
    position:absolute;
    opacity:.12;
    pointer-events:none;
    z-index:0;
}

.flower-left{
    width:180px;
    left:-35px;
    top:210px;
}

.flower-right{
    width:190px;
    right:-35px;
    bottom:35px;
}

/* WRAPPER */

.wrapper{
    width:100%;
    max-width:380px;
    padding:22px 18px;
    position:relative;
    z-index:2;
    text-align:center;
}

/* PROFILE */

.profile-frame{
    width:145px;
    height:145px;

    margin:auto;
    padding:5px;

    border-radius:50%;

    background:
    linear-gradient(
    135deg,
    #fff4d7,
    #ffbfd6,
    #d9bfff
    );

    box-shadow:
    0 0 22px rgba(255,255,255,.85),
    0 0 40px rgba(255,183,213,.45);

    animation:pulse 3s infinite;
}

.profile-frame img{
    width:100%;
    height:100%;
    border-radius:50%;

    object-fit:cover;
    object-position:center top;

    border:3px solid rgba(255,255,255,.8);
}

@keyframes pulse{
    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.015);
    }
}

/* NAME */

h1{
    margin-top:16px;

    font-family:'Cormorant Garamond',serif;
    font-size:38px;
    line-height:1.1;
    font-weight:700;

    color:#5d1a54;
}

/* DIVIDER */

.divider{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;

    margin:14px 0 24px;
}

.divider span{
    width:62px;
    height:3px;

    border-radius:20px;

    background:
    linear-gradient(
    90deg,
    #f5b59f,
    #cba8ff
    );
}

.divider i{
    font-size:18px;
    color:#e68bbd;
}

/* CARD */

.card{
    position:relative;
    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:14px 16px;
    margin-bottom:14px;

    border-radius:24px;

    text-decoration:none;
    color:#65195b;

    background:rgba(255,255,255,.28);

    border:1px solid rgba(255,255,255,.45);

    backdrop-filter:blur(16px);

    box-shadow:
    0 8px 24px rgba(194,143,255,.15);

    transition:.3s ease;
}

.card:hover{
    transform:translateY(-3px);
}

.card::before{
    content:"";
    position:absolute;

    top:0;
    left:-120%;

    width:100%;
    height:100%;

    background:
    linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,.55),
    transparent
    );

    transition:.7s;
}

.card:hover::before{
    left:120%;
}

/* LEFT */

.left{
    display:flex;
    align-items:center;
    gap:12px;
}

/* ICON */

.icon{
    width:52px;
    height:52px;

    border-radius:18px;

    display:flex;
    align-items:center;
    justify-content:center;

    flex-shrink:0;

    box-shadow:
    0 6px 14px rgba(0,0,0,.10);
}

.icon img{
    width:26px;
    height:26px;
}

/* ICON COLORS */

.whatsapp .icon{
    background:
    linear-gradient(
    135deg,
    #9df0b5,
    #25d366
    );
}

.email .icon{
    background:
    linear-gradient(
    135deg,
    #ff9fc8,
    #de5f9d
    );
}

/* TEXT */

.text{
    text-align:left;
}

.text b{
    display:block;
    font-size:18px;
    font-weight:700;
}

.text span{
    font-size:12px;
    opacity:.78;
}

/* ARROW */

.arrow{
    font-size:32px;
    color:#6f1d66;
    opacity:.55;
}

/* FOOTER */

footer{
    margin-top:18px;
    color:#4f1148;
}

.heart{
    font-size:34px;
    color:white;

    text-shadow:
    0 0 15px rgba(255,255,255,.8);

    margin-bottom:6px;
}

footer p{
    font-family:'Cormorant Garamond',serif;
}

footer p:first-of-type{
    font-size:22px;
    font-weight:600;
}

footer p:last-of-type{
    margin-top:2px;
    font-size:15px;
}

/* RIPPLE */

.ripple{
    position:absolute;
    border-radius:50%;
    transform:scale(0);
    animation:ripple .6s linear;
    background:rgba(255,255,255,.55);
}

@keyframes ripple{
    to{
        transform:scale(4);
        opacity:0;
    }
}

/* MOBILE */

@media(max-width:480px){

    .wrapper{
        max-width:340px;
        padding:18px 16px;
    }

    .profile-frame{
        width:132px;
        height:132px;
    }

    h1{
        font-size:34px;
    }

    .card{
        padding:13px 14px;
    }

    .icon{
        width:48px;
        height:48px;
    }

    .icon img{
        width:24px;
        height:24px;
    }

    .text b{
        font-size:17px;
    }

    .text span{
        font-size:11px;
    }

    .arrow{
        font-size:28px;
    }

    footer p:first-of-type{
        font-size:20px;
    }

    footer p:last-of-type{
        font-size:14px;
    }

}

</style>
</head>

<body>

    <div class="divider">

    <!-- WHATSAPP -->

    <a class="card whatsapp"

    <!-- EMAIL -->

    <a class="card email"

<script>

document.querySelectorAll('.card').forEach(btn=>{

btn.addEventListener('click',function(e){

const circle=document.createElement('span');

const d=Math.max(
this.clientWidth,
this.clientHeight
);

const r=d/2;

circle.style.width=
circle.style.height=d+'px';

circle.style.left=
(e.offsetX-r)+'px';

circle.style.top=
(e.offsetY-r)+'px';

circle.classList.add('ripple');

const ripple=this.querySelector('.ripple');

if(ripple) ripple.remove();

this.appendChild(circle);

})

})

</script>

</body>
</html>
