<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virda Ananda Putri</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    overflow-x:hidden;
    color:white;

    /* Elegant aesthetic background */
    background:
    radial-gradient(circle at top left,
    rgba(255,182,193,.18),
    transparent 30%),

    radial-gradient(circle at bottom right,
    rgba(192,132,252,.15),
    transparent 30%),

    linear-gradient(
        135deg,
        #0b1020,
        #141b34,
        #1d1635,
        #0b1020
    );

    background-size:400% 400%;
    animation:bgMove 15s ease infinite;
}

@keyframes bgMove{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

.wrapper{
    width:100%;
    max-width:430px;
    padding:40px 22px;
    text-align:center;
    position:relative;
}

/* Soft glow background */

.wrapper::before,
.wrapper::after{
    content:"";
    position:absolute;
    width:260px;
    height:260px;
    border-radius:50%;
    filter:blur(90px);
    opacity:.22;
    z-index:-1;
}

.wrapper::before{
    background:#f9a8d4;
    top:-40px;
    left:-120px;
}

.wrapper::after{
    background:#a78bfa;
    bottom:-40px;
    right:-120px;
}

/* PROFILE */

.profile{
    animation:fadeDown .8s ease;
}

.profile-frame{
    width:175px;
    height:175px;
    margin:auto;
    padding:6px;
    border-radius:50%;

    background:linear-gradient(
        135deg,
        #f9a8d4,
        #c084fc,
        #818cf8
    );

    box-shadow:
    0 0 25px rgba(192,132,252,.35),
    0 0 55px rgba(249,168,212,.18);

    animation:pulse 3s infinite;
}

.profile img{
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
    object-position:center top;
    border:4px solid rgba(255,255,255,.10);
}

@keyframes pulse{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.02);
    }
}

.profile h1{
    margin-top:22px;
    font-size:31px;
    font-weight:700;
    line-height:1.3;
}

.divider{
    width:95px;
    height:4px;
    margin:16px auto 38px;
    border-radius:20px;

    background:linear-gradient(
        90deg,
        #f9a8d4,
        #a78bfa
    );
}

/* CARD */

.card{
    position:relative;
    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:17px 18px;
    margin-bottom:18px;

    border-radius:24px;

    text-decoration:none;
    color:white;

    background:rgba(255,255,255,.06);

    border:1px solid rgba(255,255,255,.08);

    backdrop-filter:blur(18px);

    box-shadow:
    0 10px 30px rgba(0,0,0,.30);

    transition:.35s ease;
}

.card::before{
    content:"";
    position:absolute;

    top:0;
    left:-120%;

    width:100%;
    height:100%;

    background:linear-gradient(
        120deg,
        transparent,
        rgba(255,255,255,.18),
        transparent
    );

    transition:.6s;
}

.card:hover::before{
    left:120%;
}

.card:hover{
    transform:translateY(-5px) scale(1.02);
}

/* Glow */

.whatsapp:hover{
    box-shadow:
    0 0 25px rgba(37,211,102,.45);
}

.email:hover{
    box-shadow:
    0 0 25px rgba(249,168,212,.28);
}

/* CONTENT */

.left{
    display:flex;
    align-items:center;
    gap:14px;
}

.icon{
    width:54px;
    height:54px;

    border-radius:17px;

    display:flex;
    align-items:center;
    justify-content:center;

    flex-shrink:0;

    box-shadow:
    0 6px 18px rgba(0,0,0,.22);
}

.icon img{
    width:25px;
    height:25px;
}

/* ICON COLORS */

.whatsapp .icon{
    background:linear-gradient(
        135deg,
        #16a34a,
        #22c55e
    );
}

.email .icon{
    background:linear-gradient(
        135deg,
        #ec4899,
        #a855f7
    );
}

/* TEXT */

.text{
    text-align:left;
}

.text b{
    display:block;
    font-size:16px;
    font-weight:700;
}

.text span{
    font-size:13px;
    opacity:.78;
}

/* ARROW */

.arrow{
    font-size:24px;
    opacity:.45;
}

/* RIPPLE */

.ripple{
    position:absolute;
    border-radius:50%;
    transform:scale(0);
    animation:ripple .6s linear;
    background:rgba(255,255,255,.28);
}

@keyframes ripple{
    to{
        transform:scale(4);
        opacity:0;
    }
}

/* ENTRY */

.card{
    opacity:0;
    transform:translateY(25px);
}

.card:nth-child(2){
    animation:fadeUp .5s ease forwards .25s;
}

.card:nth-child(3){
    animation:fadeUp .5s ease forwards .45s;
}

@keyframes fadeDown{
    from{
        opacity:0;
        transform:translateY(-20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes fadeUp{
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* FOOTER */

footer{
    margin-top:42px;
    opacity:.75;
}

.heart{
    font-size:24px;
    margin-bottom:10px;
    color:#f9a8d4;
}

footer p{
    font-size:13px;
    line-height:1.8;
}

</style>
</head>

<body>

<div class="wrapper">

    <!-- PROFILE -->
    <div class="profile">

        <div class="profile-frame">
            <img src="profile.jpg">
        </div>

        <h1>Virda Ananda Putri</h1>

        <div class="divider"></div>

    </div>

    <!-- WHATSAPP -->
    <a class="card whatsapp"
       href="https://wa.me/6281381416817"
       target="_blank">

        <div class="left">

            <div class="icon">
                <img src="https://img.icons8.com/ios-filled/50/ffffff/whatsapp.png">
            </div>

            <div class="text">
                <b>WhatsApp</b>
                <span>Chat langsung via WhatsApp</span>
            </div>

        </div>

        <div class="arrow">›</div>

    </a>

    <!-- EMAIL -->
    <a class="card email"
       href="mailto:virdaananda75@gmail.com">

        <div class="left">

            <div class="icon">
                <img src="https://img.icons8.com/ios-filled/50/ffffff/new-post.png">
            </div>

            <div class="text">
                <b>Email</b>
                <span>Virda Ananda Putri</span>
            </div>

        </div>

        <div class="arrow">›</div>

    </a>

    <!-- FOOTER -->
    <footer>

        <div class="heart">♡</div>

        <p>Terima kasih telah berkunjung!</p>

        <p>© 2026 Virda Ananda Putri</p>

    </footer>

</div>

<script>

document.querySelectorAll('.card').forEach(btn=>{

    btn.addEventListener('click',function(e){

        const circle=document.createElement('span');

        const d=Math.max(
            this.clientWidth,
            this.clientHeight
        );

        const r=d/2;

        circle.style.width=
        circle.style.height=d+'px';

        circle.style.left=
        (e.offsetX-r)+'px';

        circle.style.top=
        (e.offsetY-r)+'px';

        circle.classList.add('ripple');

        const ripple=this.querySelector('.ripple');

        if(ripple) ripple.remove();

        this.appendChild(circle);

    })

})

</script>

</body>
</html>
