<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virda Ananda Putri</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    overflow-x:hidden;
    color:#4b1248;

    background:
    radial-gradient(circle at top left,#ffe7d6 0%,transparent 35%),
    radial-gradient(circle at bottom right,#d9b8ff 0%,transparent 35%),
    linear-gradient(135deg,#ffe8ec,#f7d9ff,#fbe7d8);

    background-size:400% 400%;
    animation:bgMove 14s ease infinite;
}

@keyframes bgMove{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

.wrapper{
    width:100%;
    max-width:430px;
    padding:40px 22px;
    text-align:center;
    position:relative;
}

/* FLOATING LIGHT */

.wrapper::before,
.wrapper::after{
    content:"";
    position:absolute;
    width:250px;
    height:250px;
    border-radius:50%;
    filter:blur(70px);
    opacity:.35;
    z-index:-1;
}

.wrapper::before{
    background:#ffb6c1;
    top:0;
    left:-80px;
}

.wrapper::after{
    background:#c084fc;
    bottom:0;
    right:-80px;
}

/* PROFILE */

.profile{
    animation:fadeDown .8s ease;
}

.profile-frame{
    width:180px;
    height:180px;
    margin:auto;
    padding:7px;
    border-radius:50%;

    background:linear-gradient(
        135deg,
        #ffd6e7,
        #f9a8d4,
        #c084fc
    );

    box-shadow:
    0 0 30px rgba(255,182,193,.7),
    0 0 60px rgba(192,132,252,.45);

    animation:pulse 3s infinite;
}

.profile img{
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
    object-position:center top;
    border:4px solid rgba(255,255,255,.5);
}

@keyframes pulse{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.03);
    }
}

.profile h1{
    margin-top:24px;
    font-size:34px;
    font-weight:700;
    line-height:1.3;
    color:#5b1459;
}

.divider{
    width:120px;
    height:4px;
    margin:18px auto 38px;
    border-radius:20px;

    background:linear-gradient(
        90deg,
        #ffb4c9,
        #c084fc
    );
}

/* CARD */

.card{
    position:relative;
    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:18px;
    margin-bottom:20px;

    border-radius:28px;

    text-decoration:none;
    color:#5b1459;

    background:rgba(255,255,255,.35);

    border:1px solid rgba(255,255,255,.45);

    backdrop-filter:blur(18px);

    box-shadow:
    0 10px 30px rgba(0,0,0,.08);

    transition:.35s ease;
}

.card::before{
    content:"";
    position:absolute;

    top:0;
    left:-120%;

    width:100%;
    height:100%;

    background:linear-gradient(
        120deg,
        transparent,
        rgba(255,255,255,.55),
        transparent
    );

    transition:.6s;
}

.card:hover::before{
    left:120%;
}

.card:hover{
    transform:translateY(-5px) scale(1.02);
}

/* GLOW */

.whatsapp:hover{
    box-shadow:
    0 0 28px rgba(37,211,102,.45);
}

.email:hover{
    box-shadow:
    0 0 28px rgba(236,72,153,.35);
}

/* CONTENT */

.left{
    display:flex;
    align-items:center;
    gap:16px;
}

.icon{
    width:62px;
    height:62px;

    border-radius:20px;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:
    0 8px 18px rgba(0,0,0,.12);
}

.icon img{
    width:30px;
}

/* ICON COLORS */

.whatsapp .icon{
    background:linear-gradient(
        135deg,
        #86efac,
        #22c55e
    );
}

.email .icon{
    background:linear-gradient(
        135deg,
        #f9a8d4,
        #ec4899
    );
}

/* TEXT */

.text{
    text-align:left;
}

.text b{
    display:block;
    font-size:17px;
    font-weight:700;
}

.text span{
    font-size:14px;
    opacity:.75;
}

/* ARROW */

.arrow{
    font-size:30px;
    opacity:.4;
}

/* RIPPLE */

.ripple{
    position:absolute;
    border-radius:50%;
    transform:scale(0);
    animation:ripple .6s linear;
    background:rgba(255,255,255,.7);
}

@keyframes ripple{
    to{
        transform:scale(4);
        opacity:0;
    }
}

/* ENTRY */

.card{
    opacity:0;
    transform:translateY(25px);
}

.card:nth-child(2){
    animation:fadeUp .5s ease forwards .25s;
}

.card:nth-child(3){
    animation:fadeUp .5s ease forwards .45s;
}

@keyframes fadeDown{
    from{
        opacity:0;
        transform:translateY(-20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes fadeUp{
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* FOOTER */

footer{
    margin-top:40px;
    color:#5b1459;
}

.heart{
    font-size:28px;
    margin-bottom:12px;
    color:#ec4899;
}

footer p{
    font-size:14px;
    line-height:1.8;
    opacity:.8;
}

</style>
</head>

<body>

<div class="wrapper">

    <!-- PROFILE -->
    <div class="profile">

        <div class="profile-frame">
            <img src="profile.jpg">
        </div>

        <h1>Virda Ananda Putri</h1>

        <div class="divider"></div>

    </div>

    <!-- WHATSAPP -->
    <a class="card whatsapp"
       href="https://wa.me/6281381416817"
       target="_blank">

        <div class="left">

            <div class="icon">
                <img src="https://img.icons8.com/ios-filled/50/ffffff/whatsapp.png">
            </div>

            <div class="text">
                <b>WhatsApp</b>
                <span>Chat langsung via WhatsApp</span>
            </div>

        </div>

        <div class="arrow">›</div>

    </a>

    <!-- EMAIL -->
    <a class="card email"
       href="mailto:virdaananda75@gmail.com">

        <div class="left">

            <div class="icon">
                <img src="https://img.icons8.com/ios-filled/50/ffffff/new-post.png">
            </div>

            <div class="text">
                <b>Email</b>
                <span>Virda Ananda Putri</span>
            </div>

        </div>

        <div class="arrow">›</div>

    </a>

    <!-- FOOTER -->
    <footer>

        <div class="heart">♡</div>

        <p>Terima kasih telah berkunjung!</p>

        <p>© 2026 Virda Ananda Putri</p>

    </footer>

</div>

<script>

document.querySelectorAll('.card').forEach(btn=>{

    btn.addEventListener('click',function(e){

        const circle=document.createElement('span');

        const d=Math.max(
            this.clientWidth,
            this.clientHeight
        );

        const r=d/2;

        circle.style.width=
        circle.style.height=d+'px';

        circle.style.left=
        (e.offsetX-r)+'px';

        circle.style.top=
        (e.offsetY-r)+'px';

        circle.classList.add('ripple');

        const ripple=this.querySelector('.ripple');

        if(ripple) ripple.remove();

        this.appendChild(circle);

    })

})

</script>

</body>
</html>
