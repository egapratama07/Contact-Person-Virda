<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Virda Ananda Putri</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;

    font-family:'Poppins',sans-serif;

    background:
    radial-gradient(circle at top left,
    rgba(255,240,230,.95),
    transparent 35%),

    radial-gradient(circle at bottom right,
    rgba(214,184,255,.65),
    transparent 35%),

    linear-gradient(
    135deg,
    #ffe7e1,
    #f8dce8,
    #efd9ff,
    #ffdfe8
    );

    background-size:400% 400%;
    animation:bgMove 16s ease infinite;
}

/* BACKGROUND MOTION */

@keyframes bgMove{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

/* SPARKLES */

body::before{
    content:"";
    position:absolute;
    inset:0;

    background-image:
    radial-gradient(rgba(255,255,255,.9) 1px, transparent 1px);

    background-size:120px 120px;

    opacity:.35;
    pointer-events:none;
}

/* GLOW */

.glow1,
.glow2{
    position:absolute;
    border-radius:50%;
    filter:blur(90px);
    z-index:0;
}

.glow1{
    width:260px;
    height:260px;
    background:#ffc7d7;
    top:-80px;
    left:-80px;
    opacity:.5;
}

.glow2{
    width:300px;
    height:300px;
    background:#d3b5ff;
    bottom:-100px;
    right:-100px;
    opacity:.4;
}

/* FLOWER DECORATION */

.flower-left,
.flower-right{
    position:absolute;
    opacity:.16;
    pointer-events:none;
    z-index:0;
}

.flower-left{
    left:-40px;
    top:230px;
    width:220px;
}

.flower-right{
    right:-40px;
    bottom:40px;
    width:240px;
}

/* WRAPPER */

.wrapper{
    width:100%;
    max-width:420px;
    padding:28px 22px;
    text-align:center;
    position:relative;
    z-index:2;
}

/* PROFILE */

.profile-frame{
    width:180px;
    height:180px;

    margin:auto;
    padding:6px;

    border-radius:50%;

    background:
    linear-gradient(
    135deg,
    #fff5d8,
    #ffbfd7,
    #d8b9ff
    );

    box-shadow:
    0 0 25px rgba(255,255,255,.85),
    0 0 50px rgba(255,183,213,.5);

    animation:pulse 3s infinite;
}

.profile-frame img{
    width:100%;
    height:100%;
    border-radius:50%;

    object-fit:cover;
    object-position:center top;

    border:4px solid rgba(255,255,255,.8);
}

@keyframes pulse{
    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.02);
    }
}

/* NAME */

h1{
    margin-top:22px;

    font-family:'Cormorant Garamond',serif;
    font-size:52px;
    line-height:1.08;
    font-weight:700;

    color:#5f1a56;
}

/* DIVIDER */

.divider{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;

    margin:18px 0 30px;
}

.divider span{
    width:80px;
    height:4px;

    border-radius:20px;

    background:
    linear-gradient(
    90deg,
    #f5b49d,
    #c9a8ff
    );
}

.divider i{
    font-size:24px;
    color:#e88abc;
}

/* CARD */

.card{
    position:relative;
    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:18px 20px;
    margin-bottom:18px;

    border-radius:28px;

    text-decoration:none;
    color:#65195b;

    background:rgba(255,255,255,.28);

    border:1px solid rgba(255,255,255,.5);

    backdrop-filter:blur(18px);

    box-shadow:
    0 10px 28px rgba(194,143,255,.18);

    transition:.35s ease;
}

.card:hover{
    transform:translateY(-4px) scale(1.01);
}

/* SHINE */

.card::before{
    content:"";
    position:absolute;

    top:0;
    left:-120%;

    width:100%;
    height:100%;

    background:
    linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,.55),
    transparent
    );

    transition:.7s;
}

.card:hover::before{
    left:120%;
}

/* LEFT */

.left{
    display:flex;
    align-items:center;
    gap:14px;
}

/* ICON */

.icon{
    width:62px;
    height:62px;

    border-radius:20px;

    display:flex;
    align-items:center;
    justify-content:center;

    flex-shrink:0;

    box-shadow:
    0 8px 18px rgba(0,0,0,.10);
}

.icon img{
    width:32px;
    height:32px;
}

/* ICON COLORS */

.whatsapp .icon{
    background:
    linear-gradient(
    135deg,
    #9cf0b4,
    #25d366
    );
}

.email .icon{
    background:
    linear-gradient(
    135deg,
    #ff9fc7,
    #de5f9c
    );
}

/* TEXT */

.text{
    text-align:left;
}

.text b{
    display:block;
    font-size:22px;
    font-weight:700;
}

.text span{
    font-size:14px;
    opacity:.8;
}

/* ARROW */

.arrow{
    font-size:42px;
    color:#6f1d66;
    opacity:.6;
}

/* FOOTER */

footer{
    margin-top:28px;
    color:#4f1148;
}

.heart{
    font-size:48px;
    color:white;

    text-shadow:
    0 0 18px rgba(255,255,255,.8);

    margin-bottom:10px;
}

footer p{
    font-family:'Cormorant Garamond',serif;
}

footer p:first-of-type{
    font-size:28px;
    font-weight:600;
}

footer p:last-of-type{
    margin-top:4px;
    font-size:18px;
}

/* RIPPLE */

.ripple{
    position:absolute;
    border-radius:50%;
    transform:scale(0);
    animation:ripple .6s linear;
    background:rgba(255,255,255,.55);
}

@keyframes ripple{
    to{
        transform:scale(4);
        opacity:0;
    }
}

/* MOBILE */

@media(max-width:480px){

    body{
        overflow:auto;
    }

    .wrapper{
        padding:30px 20px 40px;
    }

    h1{
        font-size:42px;
    }

    .profile-frame{
        width:165px;
        height:165px;
    }

    .card{
        padding:16px;
    }

    .icon{
        width:58px;
        height:58px;
    }

    .icon img{
        width:28px;
        height:28px;
    }

    .text b{
        font-size:20px;
    }

    .text span{
        font-size:13px;
    }

    .arrow{
        font-size:36px;
    }

    footer p:first-of-type{
        font-size:24px;
    }

    footer p:last-of-type{
        font-size:16px;
    }

}

</style>
</head>

<body>

<script>

document.querySelectorAll('.card').forEach(btn=>{

btn.addEventListener('click',function(e){

const circle=document.createElement('span');

const d=Math.max(
this.clientWidth,
this.clientHeight
);

const r=d/2;

circle.style.width=
circle.style.height=d+'px';

circle.style.left=
(e.offsetX-r)+'px';

circle.style.top=
(e.offsetY-r)+'px';

circle.classList.add('ripple');

const ripple=this.querySelector('.ripple');

if(ripple) ripple.remove();

this.appendChild(circle);

})

})

</script>

</body>
</html>
