<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    overflow-x:hidden;
    font-family:'Poppins',sans-serif;
    color:#43243c;

    background:
    radial-gradient(circle at top left,
    rgba(255,228,230,.95),
    transparent 30%),

    radial-gradient(circle at bottom right,
    rgba(221,214,254,.9),
    transparent 30%),

    linear-gradient(
        135deg,
        #fff7f5 0%,
        #ffeef3 35%,
        #f7ecff 70%,
        #fff5f8 100%
    );

    position:relative;
}

/* soft glow */

body::before,
body::after{
    content:"";
    position:fixed;
    width:420px;
    height:420px;
    border-radius:50%;
    filter:blur(90px);
    opacity:.22;
    z-index:-2;
}

body::before{
    background:#f9a8d4;
    top:-120px;
    left:-140px;
}

body::after{
    background:#c4b5fd;
    bottom:-120px;
    right:-140px;
}

/* floral ornaments */

.flower-left,
.flower-right{
    position:fixed;
    opacity:.13;
    z-index:-1;
}

.flower-left{
    left:-30px;
    bottom:90px;
    width:230px;
}

.flower-right{
    right:-20px;
    top:140px;
    width:210px;
    transform:rotate(180deg);
}

/* wrapper */

.wrapper{
    width:100%;
    max-width:470px;
    padding:55px 24px 45px;
    text-align:center;
    position:relative;
}

/* profile */

.profile-frame{
    width:210px;
    height:210px;
    margin:auto;
    padding:7px;
    border-radius:50%;

    background:
    linear-gradient(
        135deg,
        #fff,
        #ffd6e7,
        #e9d5ff
    );

    box-shadow:
    0 0 35px rgba(244,114,182,.22),
    0 0 65px rgba(192,132,252,.18);

    position:relative;
}

.profile-frame::before{
    content:"";
    position:absolute;
    inset:-10px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.45);
}

.profile-frame img{
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
    object-position:center top;
}

.profile h1{
    margin-top:28px;
    font-size:56px;
    line-height:1.05;
    font-family:'Cormorant Garamond',serif;
    font-weight:700;
    color:#54284a;
}

/* divider */

.divider{
    margin:18px auto 40px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
}

.divider span{
    width:80px;
    height:3px;
    border-radius:10px;
}

.divider span:first-child{
    background:linear-gradient(90deg,#ffc6d7,#e879f9);
}

.divider span:last-child{
    background:linear-gradient(90deg,#c084fc,#a5b4fc);
}

.divider i{
    font-style:normal;
    color:#e879f9;
    font-size:26px;
}

/* card */

.card{
    position:relative;
    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:20px 22px;
    margin-bottom:22px;

    border-radius:32px;

    text-decoration:none;
    color:#5b2c52;

    background:rgba(255,255,255,.42);

    border:1px solid rgba(255,255,255,.55);

    backdrop-filter:blur(20px);

    box-shadow:
    0 10px 30px rgba(215,161,188,.18),
    0 5px 12px rgba(0,0,0,.04);

    transition:.35s ease;
}

.card:hover{
    transform:translateY(-4px) scale(1.01);
}

.card::before{
    content:"";
    position:absolute;
    top:0;
    left:-120%;
    width:100%;
    height:100%;

    background:linear-gradient(
        120deg,
        transparent,
        rgba(255,255,255,.45),
        transparent
    );

    transition:.7s;
}

.card:hover::before{
    left:120%;
}

/* content */

.left{
    display:flex;
    align-items:center;
    gap:18px;
}

.icon{
    width:78px;
    height:78px;

    border-radius:26px;

    display:flex;
    align-items:center;
    justify-content:center;

    flex-shrink:0;

    box-shadow:
    0 10px 20px rgba(0,0,0,.10);
}

.icon img{
    width:40px;
    height:40px;
}

/* icon themes */

.whatsapp .icon{
    background:linear-gradient(
        135deg,
        #7ee787,
        #22c55e
    );
}

.email .icon{
    background:linear-gradient(
        135deg,
        #f9a8d4,
        #ec4899
    );
}

/* text */

.text{
    text-align:left;
}

.text b{
    display:block;
    font-size:22px;
    font-weight:600;
    color:#5b1459;
}

.text span{
    font-size:15px;
    opacity:.72;
}

/* arrow */

.arrow{
    font-size:52px;
    font-weight:300;
    opacity:.45;
    margin-left:10px;
}

/* footer */

footer{
    margin-top:55px;
}

.heart{
    font-size:68px;
    color:#f9a8d4;
    line-height:1;
    margin-bottom:20px;
}

footer p:first-of-type{
    font-size:24px;
    font-family:'Cormorant Garamond',serif;
    color:#4b1f43;
}

footer p:last-of-type{
    margin-top:10px;
    font-size:15px;
    opacity:.7;
}

/* responsive */

@media(max-width:480px){

    .profile h1{
        font-size:46px;
    }

    .card{
        padding:18px;
    }

    .icon{
        width:70px;
        height:70px;
    }

    .icon img{
        width:35px;
        height:35px;
    }

    .text b{
        font-size:20px;
    }

}

</style>
</head>
