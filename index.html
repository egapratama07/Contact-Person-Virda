<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Virda Ananda Putri</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    overflow-x:hidden;

    font-family:'Poppins',sans-serif;

    background:
    radial-gradient(circle at top left,
    rgba(255,220,230,.9),
    transparent 35%),

    radial-gradient(circle at bottom right,
    rgba(214,180,255,.85),
    transparent 35%),

    linear-gradient(
    135deg,
    #ffe9e7,
    #f8dfe7,
    #f2d9ff,
    #ffdfe7
    );

    background-size:400% 400%;
    animation:bgMove 15s ease infinite;

    position:relative;
}

/* Animated background */

@keyframes bgMove{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

/* Decorative flowers */

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;

    background-image:
    url("https://www.transparenttextures.com/patterns/stardust.png");

    opacity:.18;
}

/* FLOWER SVG LEFT */

.flower-left{
    position:fixed;
    left:0;
    top:280px;
    width:220px;
    opacity:.18;
    pointer-events:none;
}

/* FLOWER SVG RIGHT */

.flower-right{
    position:fixed;
    right:0;
    bottom:80px;
    width:240px;
    opacity:.18;
    pointer-events:none;
}

/* FLOATING LIGHT */

.light{
    position:fixed;
    border-radius:50%;
    filter:blur(70px);
    z-index:-1;
}

.light.one{
    width:280px;
    height:280px;
    background:#ffb7c5;
    top:-80px;
    left:-100px;
    opacity:.35;
}

.light.two{
    width:280px;
    height:280px;
    background:#c9a0ff;
    bottom:-80px;
    right:-100px;
    opacity:.30;
}

/* WRAPPER */

.wrapper{
    width:100%;
    max-width:470px;
    padding:55px 24px 40px;
    text-align:center;
    position:relative;
}

/* PROFILE */

.profile-frame{
    width:220px;
    height:220px;
    margin:auto;
    padding:7px;
    border-radius:50%;

    background:
    linear-gradient(
    135deg,
    #fff6d8,
    #ffb7d8,
    #d4b2ff
    );

    box-shadow:
    0 0 30px rgba(255,255,255,.7),
    0 0 60px rgba(255,183,216,.5);

    animation:pulse 3s infinite;
}

.profile-frame img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center top;

    border-radius:50%;
    border:5px solid rgba(255,255,255,.65);
}

@keyframes pulse{
    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.02);
    }
}

/* NAME */

h1{
    margin-top:28px;

    font-family:'Cormorant Garamond',serif;
    font-size:64px;
    line-height:1.1;
    color:#55134f;
    font-weight:700;
}

/* DIVIDER */

.divider{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;

    margin:22px 0 42px;
}

.divider span{
    width:105px;
    height:4px;
    border-radius:20px;

    background:linear-gradient(
    90deg,
    #f7b89f,
    #d5a4ff
    );
}

.divider i{
    font-size:28px;
    color:#e48bc3;
}

/* CARD */

.card{
    position:relative;
    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:22px 22px;
    margin-bottom:24px;

    border-radius:32px;

    text-decoration:none;
    color:#5a1454;

    background:rgba(255,255,255,.28);

    border:1px solid rgba(255,255,255,.45);

    backdrop-filter:blur(18px);

    box-shadow:
    0 10px 40px rgba(196,139,255,.18);

    transition:.35s ease;
}

.card:hover{
    transform:translateY(-6px) scale(1.02);
}

.card::before{
    content:"";
    position:absolute;

    top:0;
    left:-120%;

    width:100%;
    height:100%;

    background:
    linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,.5),
    transparent
    );

    transition:.6s;
}

.card:hover::before{
    left:120%;
}

/* LEFT */

.left{
    display:flex;
    align-items:center;
    gap:18px;
}

/* ICON */

.icon{
    width:92px;
    height:92px;

    border-radius:26px;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:
    0 12px 24px rgba(0,0,0,.12);

    flex-shrink:0;
}

.icon img{
    width:48px;
    height:48px;
}

/* ICON COLORS */

.whatsapp .icon{
    background:
    linear-gradient(
    135deg,
    #85f2a5,
    #25d366
    );
}

.email .icon{
    background:
    linear-gradient(
    135deg,
    #ff9bc3,
    #d85b97
    );
}

/* TEXT */

.text{
    text-align:left;
}

.text b{
    display:block;
    font-size:28px;
    font-weight:700;
}

.text span{
    font-size:18px;
    opacity:.8;
}

/* ARROW */

.arrow{
    font-size:68px;
    font-weight:300;
    color:#701867;
    opacity:.8;
}

/* FOOTER */

footer{
    margin-top:60px;
    color:#4e0f49;
}

.heart{
    font-size:72px;
    line-height:1;
    color:white;

    text-shadow:
    0 0 18px rgba(255,255,255,.7);

    margin-bottom:20px;
}

footer p{
    font-family:'Cormorant Garamond',serif;
}

footer p:first-of-type{
    font-size:34px;
    font-weight:600;
}

footer p:last-of-type{
    margin-top:10px;
    font-size:24px;
}

/* RIPPLE */

.ripple{
    position:absolute;
    border-radius:50%;
    transform:scale(0);
    animation:ripple .6s linear;
    background:rgba(255,255,255,.55);
}

@keyframes ripple{
    to{
        transform:scale(4);
        opacity:0;
    }
}

/* MOBILE */

@media(max-width:480px){

    h1{
        font-size:48px;
    }

    .text b{
        font-size:22px;
    }

    .text span{
        font-size:15px;
    }

    .icon{
        width:78px;
        height:78px;
    }

    .icon img{
        width:40px;
        height:40px;
    }

    .arrow{
        font-size:54px;
    }

}

</style>
</head>

<body>

<!-- Decorative glow -->
<div class="light one"></div>
<div class="light two"></div>

<!-- Floral decorations -->
<img class="flower-left"
src="https://svgshare.com/i/16vG.svg">

<img class="flower-right"
src="https://svgshare.com/i/16uQ.svg">

<div class="wrapper">

    <!-- PROFILE -->

    <div class="profile-frame">
        <img src="profile.jpg">
    </div>

    <h1>Virda Ananda Putri</h1>

    <div class="divider">
        <span></span>
        <i>✦</i>
        <span></span>
    </div>

    <!-- WHATSAPP -->

    <a class="card whatsapp"
    href="https://wa.me/6281381416817"
    target="_blank">

        <div class="left">

            <div class="icon">
                <img src="https://img.icons8.com/ios-filled/100/ffffff/whatsapp.png">
            </div>

            <div class="text">
                <b>WhatsApp</b>
                <span>Chat langsung via WhatsApp</span>
            </div>

        </div>

        <div class="arrow">›</div>

    </a>

    <!-- EMAIL -->

    <a class="card email"
    href="mailto:virdaananda75@gmail.com">

        <div class="left">

            <div class="icon">
                <img src="https://img.icons8.com/ios-filled/100/ffffff/new-post.png">
            </div>

            <div class="text">
                <b>Email</b>
                <span>Virda Ananda Putri</span>
            </div>

        </div>

        <div class="arrow">›</div>

    </a>

    <!-- FOOTER -->

    <footer>

        <div class="heart">♡</div>

        <p>Terima kasih telah berkunjung!</p>

        <p>© 2026 Virda Ananda Putri</p>

    </footer>

</div>

<script>

document.querySelectorAll('.card').forEach(btn=>{

btn.addEventListener('click',function(e){

const circle=document.createElement('span');

const d=Math.max(
this.clientWidth,
this.clientHeight
);

const r=d/2;

circle.style.width=
circle.style.height=d+'px';

circle.style.left=
(e.offsetX-r)+'px';

circle.style.top=
(e.offsetY-r)+'px';

circle.classList.add('ripple');

const ripple=this.querySelector('.ripple');

if(ripple) ripple.remove();

this.appendChild(circle);

})

})

</script>

</body>
</html>
